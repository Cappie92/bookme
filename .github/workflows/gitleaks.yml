name: Secret scan (history and current tree)

on:
  # Execute the trusted base workflow, never code supplied by the PR.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TRUSTED_SHA }}
          path: policy
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout candidate as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks 8.21.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tgz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          test "$("$RUNNER_TEMP/gitleaks/gitleaks" version)" = "8.21.2"

      - name: Test trusted gate
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: python3 policy/scripts/security/test_gitleaks_gate.py

      - name: Directed history and mandatory exact-tree gates
        shell: bash
        run: |
          set -uo pipefail
          status=0
          policy_guard=()
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            policy_guard=(--check-policy-changes)
          fi
          common=(--repo "$GITHUB_WORKSPACE/candidate" --policy-dir "$GITHUB_WORKSPACE/policy" --binary "$RUNNER_TEMP/gitleaks/gitleaks" --head "$TARGET_SHA")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 policy/scripts/security/gitleaks_gate.py "${common[@]}" --mode history || status=1
          else
            python3 policy/scripts/security/gitleaks_gate.py "${common[@]}" --mode incremental --before "$BEFORE_SHA" "${policy_guard[@]}" || status=1
          fi
          # Run even when the history gate finds a problem. Do not upload raw reports.
          python3 policy/scripts/security/gitleaks_gate.py "${common[@]}" --mode current-tree "${policy_guard[@]}" || status=1
          exit "$status"
