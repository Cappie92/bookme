name: Application tests

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 1 * * *' # 04:17 Europe/Moscow; scheduled runs may be delayed by GitHub.
  workflow_dispatch:
    inputs:
      purpose:
        description: >
          Always runs every application suite on github.sha of the selected
          ref (branch or tag tip). release does not retarget another commit;
          choose it only when that SHA is the exact revision you will ship.
          Full regression gate then requires backend, frontend, mobile and
          Playwright success on this checkout. Push of tags v* is the same
          full gate on the tagged SHA.
        type: choice
        default: full-regression
        options: [full-regression, release]

permissions:
  contents: read

concurrency:
  group: application-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      mobile: ${{ steps.scope.outputs.mobile }}
      playwright: ${{ steps.scope.outputs.playwright }}
      playwright_mode: ${{ steps.scope.outputs.playwright_mode }}
      full: ${{ steps.scope.outputs.full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      backend_scope: ${{ steps.scope.outputs.backend_scope }}
      backend_paths: ${{ steps.scope.outputs.backend_paths }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test suite-selection policy
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Select suites (unknown or invalid diff means full CI)
        id: scope
        run: python3 -B scripts/ci/select_tests.py

  # Full backend pytest is two module shards. Selected test files stay on
  # the aggregator below so an empty shard cannot report success.
  # Both jobs use the same condition: a failed selector still runs every module,
  # and a selected module list skips both jobs.
  backend-shard:
    name: backend shard ${{ matrix.shard }}
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.backend != 'false') && (needs.select.result != 'success' || needs.select.outputs.backend_scope != 'selected') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest shard
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          if ! python3 -B ../scripts/ci/backend_shards.py --shard ${{ matrix.shard }} --shards 2 > "$tmp"; then
            echo "Shard generation failed" >&2
            exit 1
          fi
          modules=()
          while IFS= read -r module || [[ -n "$module" ]]; do
            [[ -n "$module" ]] && modules+=("$module")
          done < "$tmp"
          if [[ ${#modules[@]} -eq 0 ]]; then
            echo "ERROR: backend shard ${{ matrix.shard }} has no modules" >&2
            exit 1
          fi
          for module in "${modules[@]}"; do
            base="$(basename "$module")"
            if [[ "$module" != tests/*.py || "$module" == *..* || "$module" == *" "* || "$base" != test_*.py || ! -f "$module" ]]; then
              echo "ERROR: refusing backend module ${module}" >&2
              exit 1
            fi
          done
          python -m pytest --collect-only -q --disable-warnings "${modules[@]}" > shard-nodeids.txt
          grep -q '::' shard-nodeids.txt
          python -m pytest "${modules[@]}" \
            --durations=50 \
            --durations-min=0.5 \
            --junitxml=pytest-results.xml \
            --override-ini=junit_duration_report=total
      - name: Upload pytest shard report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-pytest-shard-${{ matrix.shard }}
          path: |
            backend/pytest-results.xml
            backend/shard-nodeids.txt
          retention-days: 7
          if-no-files-found: warn

  backend-collect:
    name: backend collection
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.backend != 'false') && (needs.select.result != 'success' || needs.select.outputs.backend_scope != 'selected') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Collect backend node ids
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q --disable-warnings > all-nodeids.txt
          test -s all-nodeids.txt
      - name: Upload backend collection
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-pytest-collection
          path: backend/all-nodeids.txt
          retention-days: 7
          if-no-files-found: warn

  backend:
    name: backend
    needs: [select, backend-shard, backend-collect]
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.backend != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Require both shards when the full backend suite is selected
        env:
          BACKEND_SCOPE: ${{ needs.select.outputs.backend_scope }}
          SHARD_RESULT: ${{ needs.backend-shard.result }}
          COLLECT_RESULT: ${{ needs.backend-collect.result }}
        run: python3 -B scripts/ci/backend_shards.py --aggregate-decision
      - uses: actions/download-artifact@v7
        if: needs.select.outputs.backend_scope != 'selected'
        with:
          name: backend-pytest-shard-1
          path: shard-artifacts/1
      - uses: actions/download-artifact@v7
        if: needs.select.outputs.backend_scope != 'selected'
        with:
          name: backend-pytest-shard-2
          path: shard-artifacts/2
      - uses: actions/download-artifact@v7
        if: needs.select.outputs.backend_scope != 'selected'
        with:
          name: backend-pytest-collection
          path: collection-artifact
      - name: Check shard node ids against the full collection
        if: needs.select.outputs.backend_scope != 'selected'
        run: python3 -B scripts/ci/backend_shards.py --check-nodeids collection-artifact/all-nodeids.txt shard-artifacts/1/shard-nodeids.txt shard-artifacts/2/shard-nodeids.txt
      - uses: actions/setup-python@v6
        if: needs.select.outputs.backend_scope == 'selected'
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        if: needs.select.outputs.backend_scope == 'selected'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run selected backend modules
        if: needs.select.outputs.backend_scope == 'selected'
        working-directory: backend
        shell: bash
        env:
          BACKEND_PATHS: ${{ needs.select.outputs.backend_paths }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a modules <<< "${BACKEND_PATHS}"
          if [[ ${#modules[@]} -eq 0 ]]; then
            echo "ERROR: selected backend scope has no modules" >&2
            exit 1
          fi
          for module in "${modules[@]}"; do
            if [[ "$module" != tests/test_*.py || "$module" == *"/"*"/"* || ! -f "$module" ]]; then
              echo "ERROR: refusing backend module ${module}" >&2
              exit 1
            fi
          done
          python -m pytest "${modules[@]}" \
            --durations=50 \
            --durations-min=0.5 \
            --junitxml=pytest-results.xml \
            --override-ini=junit_duration_report=total
      - name: Upload pytest timing report
        if: ${{ needs.select.outputs.backend_scope == 'selected' && (success() || failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-pytest-results
          path: backend/pytest-results.xml
          retention-days: 7
          if-no-files-found: warn

  frontend:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.frontend != 'false') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  mobile:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.mobile != 'false') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: mobile/scripts/dev/requirements.txt
      - name: Install icon tooling
        run: python -m pip install -r scripts/dev/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run integration tests
        run: npm run test:integration

  playwright:
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.playwright != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run Playwright E2E
        env:
          CI: true
          E2E_MODE: ${{ needs.select.outputs.playwright_mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${E2E_MODE:-}" == "smoke" ]]; then
            specs_file="$(mktemp)"
            if python3 -B scripts/ci/select_tests.py --smoke-specs >"$specs_file"; then
              specs=()
              while IFS= read -r spec || [[ -n "$spec" ]]; do
                [[ -n "$spec" ]] && specs+=("$spec")
              done < "$specs_file"
              rm -f "$specs_file"
              if [[ ${#specs[@]} -eq 0 ]]; then
                echo "ERROR: SMOKE_SPECS produced an empty list" >&2
                exit 1
              fi
              echo "Playwright smoke specs: ${specs[*]}"
              ./scripts/run-playwright-e2e.sh "${specs[@]}"
            else
              status=$?
              rm -f "$specs_file"
              echo "ERROR: SMOKE_SPECS selection failed (exit ${status}); running full Playwright E2E" >&2
              ./scripts/run-playwright-e2e.sh
            fi
          else
            ./scripts/run-playwright-e2e.sh
          fi
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/dedato-e2e-backend.log
            /tmp/dedato-e2e-vite.log
          if-no-files-found: ignore
          retention-days: 7

  ci-result:
    name: Application CI result
    needs: [select, backend, frontend, mobile, playwright]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Require every selected suite to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci/select_tests.py --verify

  full-regression:
    name: Full regression gate
    needs: [select, backend, frontend, mobile, playwright]
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.full != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Require full regression on this exact SHA
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Full regression required for ${GITHUB_SHA}"
          python3 -B scripts/ci/select_tests.py --verify --require-full
