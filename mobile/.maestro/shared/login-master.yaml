appId: "${APP_ID}"
tags:
  - helper
---
# Assumes unauthenticated welcome after launchApp clearState.
# Credentials: DEV_E2E Master A. Digits-only phone input (field already prefixes +7).
- extendedWaitUntil:
    visible:
      id: "welcome-nav-auth"
    timeout: 30000
- tapOn:
    id: "welcome-nav-auth"
- tapOn:
    id: "welcome-login-button"
- extendedWaitUntil:
    visible:
      id: "phone-input"
    timeout: 10000
- tapOn:
    id: "login-tab"
    optional: true
- tapOn:
    id: "phone-input"
- eraseText: 20
- inputText: "${E2E_PHONE_DIGITS}"
- tapOn:
    id: "password-input"
- eraseText: 20
- inputText: "${E2E_PASSWORD}"
- tapOn:
    id: "login-button"
- tapOn:
    id: "push-permission-education-dismiss"
    optional: true
- extendedWaitUntil:
    visible:
      id: "bottom-nav-dashboard"
    timeout: 20000
