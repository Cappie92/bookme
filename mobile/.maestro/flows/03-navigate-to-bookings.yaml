appId: "${APP_ID}"
tags:
  - smoke
  - gate
---
# Master dashboard opens the future-bookings modal. Current UI is AllBookingsModal
# (title «Будущие записи»), not the legacy bookings-screen / all-bookings-button path.
# Dashboard compact cards do not open booking-detail-screen.
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: ../shared/login-master.yaml
- scrollUntilVisible:
    element:
      text: "Все записи"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Все записи"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Страница:"
    timeout: 15000
- assertVisible:
    text: "Страница:"
- assertVisible:
    text: "Применить"
