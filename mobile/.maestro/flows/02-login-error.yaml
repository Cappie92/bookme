appId: "${APP_ID}"
tags:
  - smoke
  - gate
---
# Wrong password must stay on login. Alert title is «Ошибка входа», not «Ошибка».
- runFlow: ../shared/launch-local.yaml
- extendedWaitUntil:
    visible:
      id: "welcome-nav-auth"
    timeout: 30000
- tapOn:
    id: "welcome-nav-auth"
- tapOn:
    id: "welcome-login-button"
- extendedWaitUntil:
    visible:
      id: "phone-input"
    timeout: 10000
- tapOn:
    id: "phone-input"
- eraseText: 20
- inputText: "9999999999"
- hideKeyboard
- tapOn:
    id: "password-input"
- eraseText: 20
- inputText: "wrongpassword"
- hideKeyboard
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible:
      text: "Ошибка входа"
    timeout: 15000
- tapOn:
    text: "OK"
- assertVisible:
    id: "login-tab"
- assertVisible:
    id: "login-screen-title"
