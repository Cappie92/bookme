appId: "${APP_ID}"
tags:
  - smoke
  - gate
---
# Operational schedule/services navigation.
# iOS: four-tab bottom nav (dashboard / schedule / services / settings).
# Android: dashboard / menu / settings; schedule and services live in the menu sheet.
# Master dashboard cards do not open booking-detail-screen; that route remains a coverage gap.
- runFlow: ../shared/launch-local.yaml
- runFlow:
    file: ../shared/login-master.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "bottom-nav-schedule"
      - extendedWaitUntil:
          visible:
            text: "Неделя"
          timeout: 15000
      - assertVisible:
          text: "День"
      - tapOn:
          id: "bottom-nav-services"
      - extendedWaitUntil:
          visible:
            text: "Мои услуги"
          timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "bottom-nav-menu"
      - tapOn:
          text: "Расписание"
      - extendedWaitUntil:
          visible:
            text: "Неделя"
          timeout: 15000
      - tapOn:
          id: "bottom-nav-menu"
      - tapOn:
          text: "Услуги"
      - extendedWaitUntil:
          visible:
            text: "Мои услуги"
          timeout: 15000
- assertVisible:
    text: "Мои услуги"
