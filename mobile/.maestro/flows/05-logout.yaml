appId: "${APP_ID}"
tags:
  - smoke
  - gate
---
# Master logout from settings. Master settings has no logout-button testID;
# label is «Выйти из аккаунта», confirm alert button is «Выйти».
# After logout AuthGate returns to welcome, not login-tab.
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: ../shared/login-master.yaml
- tapOn:
    id: "bottom-nav-settings"
- extendedWaitUntil:
    visible:
      text: "Настройки"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Выйти из аккаунта"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Выйти из аккаунта"
- tapOn:
    text: "Выйти"
- extendedWaitUntil:
    visible:
      id: "welcome-nav-auth"
    timeout: 20000
- assertVisible:
    id: "welcome-nav-auth"
